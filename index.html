<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Taiwan Educational Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F1; --card:#FFFFFF; --ink:#13202E; --muted:#5A6672; --rule:#D3D9D5;
  --bus:#C8283A; --bus-ink:#FFFFFF; --warn:#9A5B00;
  --head:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.45 var(--body);
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.top{background:var(--bus);color:var(--bus-ink);padding:calc(18px + env(safe-area-inset-top,0px)) 20px 18px}
.top h1{margin:0;font:800 30px/1.05 var(--head);font-stretch:100%;letter-spacing:-.01em}
.top p{margin:6px 0 0;font-size:16px;opacity:.92}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

.buses{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 4px}
.busbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:2px solid var(--c);
  background:var(--card);border-radius:14px;font:600 14px var(--body)}
.busbtn .badge{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--c);color:var(--ci);font:800 20px var(--head)}
.busbtn[aria-pressed="true"]{background:var(--c);color:var(--ci)}
.busbtn[aria-pressed="true"] .badge{background:var(--ci);color:var(--c)}

.days{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border:1.5px solid var(--rule);background:var(--card);border-radius:999px;font:600 15px var(--body);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

.dayhead{margin:18px 0 14px;font:800 24px/1.15 var(--head);letter-spacing:-.005em}
.tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:6px;background:#FFF1D6;color:var(--warn);font:600 13px var(--body);vertical-align:middle}

.line{list-style:none;margin:0;padding:0}
.stop{position:relative;display:grid;grid-template-columns:70px 22px 1fr;column-gap:12px;padding-bottom:22px}
.stop::before{content:"";position:absolute;left:93px;top:8px;bottom:-8px;width:4px;background:var(--bus)}
.stop:last-child::before{bottom:auto;height:10px}
.stop time{font:800 19px/1.1 var(--head);text-align:right;padding-top:2px}
.stop time small{display:block;font:600 12px var(--body);color:var(--muted);margin-top:1px}
.mark{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;border:5px solid var(--bus);background:var(--paper);margin-top:1px}
.meal .mark{width:12px;height:12px;border:0;background:var(--bus);margin:6px 5px}
.stop h3{margin:0;font:700 18px/1.25 var(--head);font-stretch:95%}
.stop p{margin:3px 0 0;color:var(--muted);font-size:16px}

.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:18px;margin:16px 0}
.card h2{margin:0 0 6px;font:800 21px var(--head)}
.muted{color:var(--muted)}
.err{color:#A3202E;font-weight:600}
label{display:block;font-weight:600;margin:10px 0 6px}
select,input{width:100%;padding:12px;border:1.5px solid var(--rule);border-radius:10px;background:#fff;font:inherit}
.primary{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--bus);color:var(--bus-ink);font:700 17px var(--body)}
.link{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;font-size:15px}
.photo{display:block;margin:6px 0 18px;padding:14px;border-radius:12px;border:2px solid var(--ink);text-align:center;font-weight:700;color:var(--ink);text-decoration:none}

.big{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:76px;margin-top:12px;padding:14px 18px;
  border:2px solid var(--bus);border-radius:16px;background:var(--card);text-align:left;font:800 21px var(--head)}
.big small{display:block;font:400 15px var(--body);color:var(--muted);margin-top:2px}
.big.done{background:var(--bus);color:var(--bus-ink)}
.big.done small{color:inherit;opacity:.9}
.big .tick{font-size:28px}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
.seg button{padding:10px;border:1.5px solid var(--rule);border-radius:10px;background:var(--card);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0}
.sum b{font:800 34px var(--head)}
.roster{list-style:none;margin:0;padding:0}
.roster button{display:flex;justify-content:space-between;width:100%;padding:13px 4px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left}
.roster .ok{color:var(--bus);font-weight:700}
.roster .no{color:var(--muted)}

.info h3{margin:18px 0 4px;font:700 18px var(--head)}
.info ul{margin:4px 0;padding-left:20px}

.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);
  border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{padding:16px 2px;border:0;border-top:4px solid transparent;background:none;font:700 14px var(--body);color:var(--muted)}
.nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--bus)}

.learn{margin:8px 8px 0 0;padding:8px 14px;border:2px solid var(--bus);border-radius:999px;background:var(--card);font:700 15px var(--body)}
.learn[aria-expanded="true"]{background:var(--bus);color:var(--bus-ink)}
.panel{margin-top:12px;padding:14px;background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--bus);border-radius:12px}
.panel h4{margin:14px 0 4px;font:800 16px var(--head)}
.panel h4:first-child{margin-top:0}
.panel ul{margin:4px 0 0;padding-left:20px}
.stop .panel p.q{margin:4px 0 8px;color:var(--ink);font-weight:600}
.photobtn{display:inline-block;margin-top:10px;padding:9px 14px;border:2px solid var(--ink);border-radius:10px;font-weight:700;color:var(--ink);text-decoration:none}
textarea{width:100%;min-height:120px;padding:12px;border:1.5px solid var(--rule);border-radius:10px;background:#fff;font:inherit;resize:vertical}
.ghost{display:block;width:100%;margin-top:10px;padding:12px;border:2px solid var(--ink);border-radius:12px;background:none;font:700 16px var(--body)}
.ans{padding:12px 0;border-bottom:1px solid var(--rule)}
.ans h3{margin:0;font:700 17px var(--head)}
.ans h3 small{margin-left:6px;font:400 14px var(--body);color:var(--muted)}
.ans p{margin:4px 0 0;white-space:pre-wrap}
.miss{margin:14px 0}
.miss summary{cursor:pointer;font-weight:600}
.qbox{margin:10px 0 4px;font-weight:600}

.seg.five{grid-template-columns:repeat(3,1fr);gap:6px}
.seg.five button{padding:10px 2px;font-size:14px}
.cps{list-style:none;margin:0;padding:0}
.cp{border-bottom:1px solid var(--rule)}
.cphead{display:grid;grid-template-columns:78px 1fr;column-gap:10px;width:100%;padding:14px 4px;border:0;background:none;text-align:left}
.cptime{grid-row:span 2;font:800 17px/1.2 var(--head)}
.cptitle{font:700 17px/1.25 var(--head)}
.cphead .ok{color:#17663F;font-weight:700}
.cphead .no{color:var(--muted)}
.cp.done .cptitle::after{content:" \2713";color:#17663F}
.cppanel{padding:2px 4px 18px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.nm{padding:10px 8px;border:1.5px solid var(--bus);border-radius:10px;background:var(--card);text-align:left;font-size:15px}
.nm.out{background:#FBE3E5;border-color:#A3202E;color:#7A1520;text-decoration:line-through}
.syncnote{margin:10px 0;padding:10px 12px;border-radius:10px;background:#FFF1D6;color:var(--warn);font-weight:600}
.ovcard{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px;margin:10px 0;background:var(--card);border:1px solid var(--rule);border-left:6px solid var(--c);border-radius:12px}
.ovbadge{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font:800 22px var(--head)}
.ovcount{font:800 30px var(--head);text-align:right}
.ovcount small{font:600 14px var(--body);color:var(--muted)}
.qcard{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:16px;margin:12px 0;background:var(--card);border:1px solid var(--rule);border-radius:16px}
.qcard h3{margin:0;font:800 19px var(--head)}
.qcard p{margin:4px 0}
.stamp{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;border:3px dashed var(--rule);color:var(--muted);font:800 24px var(--head);text-align:center}
.stamp.on{border:5px double var(--bus);color:var(--ink);transform:rotate(-8deg);font-size:12px;letter-spacing:.08em}
.okmsg{color:#17663F;font-weight:700}
.qchip{display:inline-block;margin:8px 8px 0 0;padding:6px 12px;border-radius:999px;background:#E9EDE9;font:600 14px var(--body)}
.qchip.got{background:var(--bus);color:var(--bus-ink)}
.count{margin-left:8px;font:600 16px var(--body);color:var(--muted)}

.stars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0 2px}
.star{min-height:48px;border:2px solid var(--ink);border-radius:12px;background:var(--card);font:800 20px var(--head)}
.star[aria-pressed="true"]{background:var(--ink);color:#fff}
.starlabels{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px;color:var(--muted)}
.evq{padding:16px 0;border-bottom:1px solid var(--rule)}
.evq h3{margin:0 0 4px;font:800 18px/1.25 var(--head)}
.evq p{margin:0 0 6px}
.evq .qn{color:var(--muted)}
.fbday{margin:20px 0 4px;font:800 19px var(--head)}
.fb{border-bottom:1px solid var(--rule);padding-bottom:10px}
.fbhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;padding:12px 4px 8px;border:0;background:none;text-align:left}
.fbt{font:700 17px/1.25 var(--head)}
.fbt small{display:block;margin-top:2px;font:400 14px/1.35 var(--body);color:var(--muted)}
.fbavg{font:800 26px var(--head);white-space:nowrap}
.fbavg small{font:600 14px var(--body);color:var(--muted)}
.bar{height:8px;margin:0 4px;background:#E3E8E4;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bus)}
.buschips{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 4px 0;font-size:15px}
.cmt{margin:8px 4px 0;padding:8px 10px;background:var(--card);border-left:4px solid var(--rule);border-radius:6px}
@media (prefers-reduced-motion:no-preference){.big,.busbtn,.chip{transition:background-color .15s}}
</style>
</head>
<body>
<header class="top"><div class="wrap" style="padding:0"><h1>Taiwan Educational Tour</h1><p id="range"></p></div></header>
<main class="wrap" id="app"></main>
<nav class="nav" aria-label="Sections">
  <button data-tab="itinerary">Itinerary</button>
  <button data-tab="quest">Quest</button>
  <button data-tab="eval">Evaluate</button>
  <button data-tab="info">Info</button>
  <button data-tab="teachers">Teachers</button>
</nav>

<script>
/* ============ SETTINGS (edit these) ============ */
const CONFIG = {
  // Paste your Google Apps Script web app link here (it ends in /exec).
  // Leave blank to run in demo mode (data is saved only on that one phone).
  sheetsUrl: "https://script.google.com/macros/s/AKfycbwQo8M24oM94zAAz-nAWU5NQu5pHfO6epad3VcxRekBJuj0V-ikD3dex28yUXfDogVU/exec",
  // Used in demo mode only. With Google Sheets, the real teacher PIN is set inside the script.
  teacherPin: "2026",
  // One link where students upload their quest photos and videos (a Padlet board, Google Drive folder or Google Form).
  // Leave blank to hide the button. A single quest can have its own link: add  upload:"https://..."  to it in QUESTS.
  questUpload: "",
  // Paste a Padlet (or other) link for each day. Blank = hidden.
  photoLinks: { 1:"", 2:"", 3:"", 4:"", 5:"", 6:"" },
  // Add teacher contacts, e.g. { name: "Ms. Reyes", phone: "+63 900 000 0000" }
  contacts: [],
  // Marks parts of the itinerary that still need confirming. Set to false before sharing with students.
  showDraftFlags: false
};

/* ============ BUSES ============ */
const BUSES = [
  { n:1, color:"#C8283A", ink:"#FFFFFF" },
  { n:2, color:"#1F62B5", ink:"#FFFFFF" },
  { n:3, color:"#1E7F4F", ink:"#FFFFFF" },
  { n:4, color:"#F0A202", ink:"#13202E" }
];

/* ============ ROSTER (numbers only, no names) ============
   Students are identified by bus and assigned number, for example B2-07 is Bus 2, number 7.
   Real names are NOT in this file, because this website is public. They live in the "roster" tab of your
   private Google Sheet, and teachers load them with the PIN.
   LAYOUT lists the groups on each bus in order: 2 = a pair, 3 = a trio. Change it if the groups change. */
const LAYOUT = {
  1: [2,2,2,2,2,2,2,2,2,2,3,2,2,3],
  2: [2,2,2,2,2,2,2,2,2,2,2,2,2,2,2],
  3: [2,2,2,2,2,2,2,2,2,2,2,2,2,2,2],
  4: [2,2,2,2,2,2,2,2,2,3,2,2,3]
};
const ROSTER = [];
(function(){
  let pairNo = 0;
  Object.keys(LAYOUT).forEach(bus=>{
    let n = 0;
    LAYOUT[bus].forEach(size=>{
      pairNo++;
      const pair = "P" + String(pairNo).padStart(2,"0");
      for(let j=0;j<size;j++){ n++; ROSTER.push({ id:"B"+bus+"-"+String(n).padStart(2,"0"), n, bus:+bus, pair }); }
    });
  });
})();
const PAIRS = {};
ROSTER.forEach(r => { (PAIRS[r.pair] = PAIRS[r.pair] || { id:r.pair, bus:r.bus, members:[] }).members.push(r); });
const pairNum = id => parseInt(String(id).slice(1),10);
const listNames = a => a.length<2 ? a.join("") : a.slice(0,-1).join(", ") + " and " + a[a.length-1];

/* ============ GUIDE: facts, photos and a guide question for each stop ============
   Each place needs: name, photo (what the "See photos" button searches for),
   facts (3 short lines), question. A stop picks up its place automatically from
   its title using PLACE_RULES below. If you rename a stop, check the rule still matches. */
const GUIDE = {
  "st-ignatius": { name:"St. Ignatius High School", photo:"St. Ignatius High School Taipei",
    facts:["It is a Jesuit school. Jesuit missionaries founded it in Shanghai in 1850.",
           "The school moved to Taipei in 1963.",
           "Its Chinese name is 徐匯中學 (Xúhuì Zhōngxué)."],
    question:"Every school has its own traditions. What is one way St. Ignatius is similar to your school, and one way it is different?" },
  "pineapple-cake": { name:"DIY Pineapple Cake", photo:"Taiwan pineapple cake",
    facts:["Pineapple cake (鳳梨酥, fènglí sū) is one of Taiwan's best-known pastries and a popular gift to take home.",
           "In Taiwanese Hokkien, the word for pineapple sounds like a phrase meaning \"prosperity arrives\", so the cake is linked to good luck.",
           "Some bakeries mix winter melon into the pineapple filling to balance the sour taste."],
    question:"Describe, step by step, how you made your pineapple cake. Which step was the hardest, and what would you change next time?" },
  "robot-wonderland": { name:"Sha Yang Ye Robot Museum", photo:"Sha Yang Ye Robot Wonderland Taoyuan",
    facts:["Sha Yang Ye Robot Wonderland is in Taoyuan. It opened in 2013 at the headquarters of Sha Yang Ye Industrial Co.",
           "The company is a leading maker of high-precision micro geared motors, a main part inside many robots.",
           "Visitors can see more than 30 kinds of robots built for land, sea and air."],
    question:"Choose one robot you saw. What job does it do, and how could a robot like it help people in your community?" },
  "hsinchu": { name:"Hsinchu Science Park", photo:"Hsinchu Science Park Taiwan",
    facts:["The park was set up in 1980 and was Taiwan's first science park.",
           "It is a major center for semiconductors and electronics, and is often called Taiwan's Silicon Valley.",
           "TSMC, one of the world's biggest chipmakers, has its headquarters in the park."],
    question:"Why might many technology companies choose to work close together in one science park? Give one advantage and one possible problem." },
  "cks-hall": { name:"Chiang Kai-shek Memorial Hall", photo:"Chiang Kai-shek Memorial Hall Taipei",
    facts:["Chiang Kai-shek was born in 1887 in Zhejiang, China. He led the Republic of China's army in the Northern Expedition (1926 to 1928) and was a wartime leader during World War II.",
           "After the Nationalists lost the Chinese Civil War, his government moved to Taiwan in 1949. He led it until he died on 5 April 1975.",
           "The hall was completed in April 1980, five years after his death. Taiwan was under martial law from 1949 to 1987, so people today hold different views about his legacy."],
    question:"Chiang Kai-shek's life covers some of the biggest events in modern Chinese and Taiwanese history. Using the exhibition and what your guide shares, describe two events from his life. Then explain why people today hold different opinions about his legacy." },
  "jinwen": { name:"Jinwen University", photo:"Jinwen University of Science and Technology Xindian",
    facts:["Jinwen University of Science and Technology is a private university in Xindian District, New Taipei City.",
           "It became a university of science and technology in 2007. Before that it was an institute of technology.",
           "Its programs include hospitality and tourism, business, engineering and design."],
    question:"Write one new thing you learned from the seminar, and one question you still have for the speaker." },
  "taipei-101": { name:"Taipei 101", photo:"Taipei 101 building",
    facts:["Taipei 101 is 508 meters tall and has 101 floors above ground.",
           "When it was finished in 2004 it was the world's tallest building, a title it held until 2010.",
           "A huge steel ball inside the tower, called a tuned mass damper, swings to reduce sway from typhoon winds and earthquakes."],
    question:"How do you think engineers keep a very tall building safe from earthquakes and typhoons? Share your idea, then compare it with what you find out." },
  "astronomical-museum": { name:"Taipei Astronomical Museum", photo:"Taipei Astronomical Museum Shilin",
    facts:["The museum opened on 7 November 1996 in Shilin District.",
           "Its planetarium sits under a golden dome about 35 meters across and is known as one of the largest in Asia.",
           "The top floor has observatories and a radio telescope."],
    question:"What is the most surprising thing you learned about space? Explain it in your own words, as if you were teaching a classmate." },
  "ntsec": { name:"National Taiwan Science Education Center", photo:"National Taiwan Science Education Center Taipei",
    facts:["The center was established in 1956 and moved to its current home in Shilin in 2003.",
           "Its permanent exhibits cover life science, physics, chemistry, mathematics and earth science.",
           "It also hosts national science fairs for elementary and high school students."],
    question:"Choose one hands-on exhibit. What science idea does it show, and how would you explain it to a younger student?" },
  "ximending": { name:"Ximending Shopping Area", photo:"Ximending Taipei",
    facts:["Ximending is a pedestrian shopping district in Taipei, famous for youth fashion, street food and entertainment.",
           "The area was developed in the early 1900s, during the Japanese colonial period. The Red House theater, opened in 1908, still stands there.",
           "It is often compared to Tokyo's Shibuya and Harajuku districts."],
    question:"Compare Ximending with a shopping area you know back home. What is one thing that is similar and one thing that is different?" },
  "raohe": { name:"Raohe Night Market", photo:"Raohe Street Night Market Taipei",
    facts:["Raohe Street Night Market is one of Taipei's oldest night markets and is about 600 meters long.",
           "Its famous snack is the pepper bun (胡椒餅), baked against the wall of a barrel-shaped oven.",
           "Ciyou Temple stands at the east end of the market."],
    question:"Which food did you try? Describe its taste, smell and texture to someone who has never had it." },
  "shifen-falls": { name:"Shifen Waterfalls", photo:"Shifen Waterfall Taiwan",
    facts:["Shifen Waterfall is on the Keelung River in New Taipei City. The same river also flows through Taipei.",
           "It is about 40 meters wide and 20 meters high.",
           "It is nicknamed the Niagara Falls of Taiwan."],
    question:"Describe the waterfall using at least three senses: what you saw, heard and felt. When do you think it looks most powerful, and why?" },
  "pingxi": { name:"Pingxi Sky Lantern and Shifen Old Street", photo:"Pingxi sky lantern Shifen Old Street",
    facts:["A popular local story says villagers first released sky lanterns to tell their families they were safe.",
           "Today people write wishes on a lantern before sending it into the sky.",
           "Shifen Old Street is built along a railway line, and trains pass right through the street."],
    question:"What did your group of 3 to 4 choose to write on your lantern, and how did you decide together?" },
  "bubble-tea": { name:"DIY Bubble Milk Tea", photo:"Taiwan bubble milk tea",
    facts:["Bubble milk tea was invented in Taiwan in the 1980s. The chewy balls are made from tapioca.",
           "Two Taiwanese cities, Taichung and Tainan, each claim to be where it began.",
           "In Taiwan it is called pearl milk tea (珍珠奶茶, zhēnzhū nǎichá)."],
    question:"List the steps you followed to make your drink. How would you explain bubble tea to someone back home who has never tried it?" }
};
const PLACE_RULES = [
  [/Ignatius/i,"st-ignatius"], [/Pineapple/i,"pineapple-cake"], [/Sha Yang|Robot/i,"robot-wonderland"],
  [/Hsinchu/i,"hsinchu"], [/Chiang|Memorial Hall/i,"cks-hall"], [/Jinwen/i,"jinwen"],
  [/Taipei 101/i,"taipei-101"], [/Astronomical/i,"astronomical-museum"], [/Science Education/i,"ntsec"],
  [/Ximending/i,"ximending"], [/Raohe/i,"raohe"], [/Shifen Waterfall/i,"shifen-falls"],
  [/Pingxi/i,"pingxi"], [/Bubble/i,"bubble-tea"]
];
const placeFor = title => { const r = PLACE_RULES.find(x=>x[0].test(title)); return r ? r[1] : null; };

/* ============ ITINERARY ============ */
const ALL = [1,2,3,4];
// cp = a checkpoint where teachers take attendance. Flights are skipped. Add {cp:false} to any stop to skip it too.
// rate = students can rate this stop. Flights, pick-ups, airport arrivals and "back to the hotel" are skipped.

// Talks to the Google Sheet through your Apps Script link. Retries a few times if Google is busy.
async function api(action, payload = {}){
  const tries = 3;
  for(let i=0;i<tries;i++){
    try{
      const r = await fetch(CONFIG.sheetsUrl, {
        method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body:JSON.stringify({ action, pin:state.pin||"", ...payload })
      });
      const j = await r.json();
      if(j.ok) return j.data;
      if(j.error==="busy"){ await sleep(500*(i+1)); continue; }
      const err = new Error(j.error||"error"); err.fatal = true; throw err;
    }catch(e){
      if(e.fatal || i===tries-1) throw e;
      await sleep(600*(i+1));
    }
  }
  throw new Error("busy");
}

const LOCAL_WRITE = {
  saveCheckpoint(p){
    const all = store.get("tour_cps",[]).filter(x=>x.key!==p.key);
    all.push({ key:p.key, day:p.day, bus:p.bus, time:p.time, title:p.title, present:p.total-p.missing.length, total:p.total,
      missing_names:p.missing_names, missing_ids:p.missing, checked_at:p.at, checked_by:p.by||"" });
    store.set("tour_cps",all);
  },
  awardStamp(p){
    const all = store.get("tour_stamps",[]).filter(x=>!(x.pair===p.pair && x.quest===p.quest));
    all.push({ pair:p.pair, quest:p.quest, by:p.by||"", awarded_at:new Date().toISOString() }); store.set("tour_stamps",all);
  },
  revokeStamp(p){
    store.set("tour_stamps", store.get("tour_stamps",[]).filter(x=>!(x.pair===p.pair && x.quest===p.quest)));
  }
};
async function teacherWrite(action, payload, dk){
  if(!remote){ LOCAL_WRITE[action](payload); return 0; }
  const q = qStore.get().filter(x=>x.dk!==dk);          // a newer save for the same thing replaces the older one
  q.push({ id:Date.now()+"-"+Math.random().toString(36).slice(2,7), dk, action, payload });
  qStore.set(q);
  return flushQueue();
}
let flushing = false;
async function flushQueue(){
  if(!remote || flushing || !state.pin) return 0;
  flushing = true; let sent = 0;
  try{
    for(;;){
      const q = qStore.get(); if(!q.length) break;
      const it = q[0];
      try{ await api(it.action, it.payload); }
      catch(e){
        if(!e.fatal) break;                                  // no signal, or Google is busy: keep it and try later
        qStore.set(qStore.get().filter(x=>x.id!==it.id));   // the server refused it: drop it so it cannot block the rest
        alert("A record could not be saved (" + e.message + "). Please tell the person who runs the site.");
        continue;
      }
      qStore.set(qStore.get().filter(x=>x.id!==it.id)); sent++;
    }
  } finally { flushing = false; }
  return sent;
}

function splitTime(t){
  const parts = String(t).split(/\s*[-–]\s*/);
  const parse = z => {
    const m = (z||"").trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?$/i);
    return m ? { h:+m[1], mi:m[2]||"00", ap:(m[3]||"").toUpperCase() } : null;
  };
  const a = parse(parts[0]), b = parts[1] ? parse(parts[1]) : null;
  if(!a) return { start:String(t), mer:"", end:"" };
  let ap = a.ap;
  if(!ap && b && b.ap){
    ap = b.ap;
    if((a.h%12) > (b.h%12)) ap = (ap==="PM") ? "AM" : "PM";
  }
  const end = b ? `${b.h}:${b.mi} ${b.ap||ap}`.trim() : "";
  return { start:`${a.h}:${a.mi}`, mer:ap, end };
}

  if(q.type==="rate") return `<section class="evq"><h3><span class="qn">${n}.</span> ${esc(q.title)}</h3><p>${esc(q.text)}</p>
    ${starsHTML("e:"+q.id, e[q.id+"_r"]||0)}
    <label for="ev-${q.id}-c">Comment (optional)</label>
    <textarea id="ev-${q.id}-c" data-ev="${q.id}_c" rows="3" maxlength="500">${esc(e[q.id+"_c"]||"")}</textarea></section>`;
  return `<section class="evq"><h3><span class="qn">${n}.</span> ${esc(q.title)}</h3>
    <label for="ev-${q.id}" style="margin-top:0">${esc(q.text)}</label>
    <textarea id="ev-${q.id}" data-ev="${q.id}" rows="4" maxlength="1000">${esc(e[q.id]||"")}</textarea></section>`;
}

function viewEval(){
  if(!state.me) return pickCard("Pick your bus and assigned number once. This phone will remember it.");
  return `<h2 class="dayhead">Final evaluation</h2>
    <p class="muted" style="margin-top:0">Be honest and specific. Your feedback helps us plan the next tour. You can save now and come back to finish later.</p>

function viewQuest(){
  if(!state.me) return pickCard("Pick your bus and assigned number once. This phone will remember it, and you will see your pair's stamps here.");
  const pr = PAIRS[state.me.pair];
  const mates = pr.members.filter(m=>m.id!==state.me.id).map(m=>"No. "+m.n);
  const got = QUESTS.filter(q=>state.stamps[q.id]).length;
  return `<section class="card"><h2>Bus ${state.me.bus}, No. ${state.me.n}</h2>
    <p class="muted" style="margin:0">Pair ${pairNum(pr.id)}${mates.length?" with "+esc(listNames(mates)):""}. <button class="link" data-act="switchme">Not you?</button></p></section>
    <h2 class="dayhead">Tour Quest<span class="count">${got} of ${QUESTS.length} stamps</span></h2>

      const earned = !!state.stamps[q.id], up = q.upload || CONFIG.questUpload;

}

// What we know about one bus at one stop: the saved record, or a record still waiting in the phone's queue.
function cpRecord(key){
  const it = qStore.get().find(x=>x.action==="saveCheckpoint" && x.payload.key===key);
  if(it){ const p = it.payload;
    return { present:p.total-p.missing.length, total:p.total, missing_ids:p.missing, checked_at:p.at, pending:true }; }
  return state.cpRows.find(r=>r.key===key) || null;
}

function cpPanel(key, roster){
  const miss = state.cp.missing, n = roster.length, here = n - miss.size;
  return `<div class="cppanel"><p class="muted" style="margin:0">Everyone starts as present. Tap a name to mark that student as missing.</p>
    <div class="names">${roster.map(r=>
      `<button class="nm ${miss.has(r.id)?"out":""}" data-act="cpname" data-id="${r.id}" aria-pressed="${!miss.has(r.id)}">${esc(tag(r))}</button>`).join("")}</div>
    <button class="primary" data-act="cpsave" data-k="${esc(key)}">${miss.size ? `Check in ${here} (${miss.size} missing)` : `Check in all ${n}`}</button></div>`;
}

function paintCp(){
  const box = $("#cplist"); if(!box) return;
  const stops = cpStops(state.day, state.tbus), roster = rosterOf(state.tbus);
  const note = state.cpErr ? `<li class="err" style="padding:8px 0">Could not load saved check-ins. What you see may be out of date.</li>` : "";
  box.innerHTML = note + (stops.map(x=>{
    const key = rowKey(state.day, x.title, state.tbus), rec = cpRecord(key);
    const open = !!state.cp && state.cp.key===key, tm = splitTime(x.t);
    const status = rec
      ? `<span class="ok">${rec.present} of ${rec.total} at ${fmtTime(rec.checked_at)}${rec.pending?" (waiting to sync)":""}</span>`
      : `<span class="no">Not checked in</span>`;
    return `<li class="cp ${rec?"done":""}"><button class="cphead" data-act="cpopen" data-k="${esc(key)}" aria-expanded="${open}">
      <span class="cptime">${tm.start} ${tm.mer}</span><span class="cptitle">${esc(x.title)}</span>${status}</button>${open?cpPanel(key, roster):""}</li>`;
  }).join("") || `<li class="muted" style="padding:12px 0">No checkpoints for this bus on this day.</li>`);
}

const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const f1 = n => (Math.round(n*10)/10).toFixed(1);
const commentsHTML = rs => {
  const w = rs.filter(r=>r.comment);
  return w.length ? w.map(r=>`<p class="cmt"><b>${r.rating} of 5</b>, Bus ${r.bus}: ${esc(r.comment)}</p>`).join("")
                  : `<p class="muted" style="margin:8px 4px 0">No comments on this stop.</p>`;
};

function paintFeedback(){
  const box = $("#fbbody"); if(!box) return;
  const bf = state.tbusF;
  if(state.fbmode==="stops"){
    const rows = state.fbRows.filter(r=>!bf || r.bus===bf);
    const by = {}; rows.forEach(r=>{ (by[r.stop_key] = by[r.stop_key] || []).push(r); });
    let html = "";
    DAYS.forEach(d=>{
      const seen = new Set(), items = [];
      d.stops.forEach(x=>{ if(!x.rate) return; const k = stopKey(d.n,x); if(seen.has(k)) return; seen.add(k); items.push({ k, title:titleFor(x) }); });
      if(!items.length) return;
      html += `<h3 class="fbday">Day ${d.n}, ${fmtDate(d.date,{weekday:"long",month:"short",day:"numeric"})}</h3>`;
      items.forEach(it=>{
        const rs = by[it.k] || [], a = avg(rs.map(r=>r.rating)), open = state.fbOpen===it.k;
        html += `<article class="fb"><button class="fbhead" data-act="fbopen" data-k="${it.k}" aria-expanded="${open}">
          <span class="fbt">${esc(it.title)}<small>${rs.length ? rs.length+" rating"+(rs.length>1?"s":"") : "No ratings yet"}</small></span>
          ${rs.length ? `<span class="fbavg">${f1(a)}<small> of 5</small></span>` : ""}</button>
          ${rs.length ? `<div class="bar"><i style="width:${a/5*100}%"></i></div>` : ""}${open ? commentsHTML(rs) : ""}</article>`;
      });
    });
    box.innerHTML = html || `<p class="muted">No stops to rate.</p>`;
    return;
  }
  const rows = state.evRows.filter(r=>!bf || r.bus===bf);
  const total = ROSTER.filter(r=>!bf || r.bus===bf).length;
  let html = `<div class="sum"><div><b>${rows.length}</b> of ${total} submitted</div></div>`;
  EVAL.forEach((q,i)=>{
    if(q.type==="rate"){
      const vals = rows.map(r=>r[q.id+"_r"]).filter(Boolean), cm = rows.filter(r=>r[q.id+"_c"]);
      const per = bf ? "" : `<div class="buschips">${BUSES.map(b=>{
        const v = rows.filter(r=>r.bus===b.n).map(r=>r[q.id+"_r"]).filter(Boolean);
        return `<span>Bus ${b.n}: <b>${v.length ? f1(avg(v)) : "-"}</b></span>`; }).join("")}</div>`;
      html += `<article class="fb"><div class="fbhead"><span class="fbt">${i+1}. ${esc(q.title)}<small>${vals.length} rating${vals.length===1?"":"s"}</small></span>
        ${vals.length ? `<span class="fbavg">${f1(avg(vals))}<small> of 5</small></span>` : ""}</div>
        ${vals.length ? `<div class="bar"><i style="width:${avg(vals)/5*100}%"></i></div>` : ""}${per}
        ${cm.length ? `<details class="miss"><summary>Comments (${cm.length})</summary>${cm.map(r=>`<p class="cmt"><b>${r[q.id+"_r"] ? r[q.id+"_r"]+" of 5" : "No rating"}</b>, Bus ${r.bus}: ${esc(r[q.id+"_c"])}</p>`).join("")}</details>` : ""}</article>`;
    } else {
      const ans = rows.filter(r=>r[q.id]);
      html += `<article class="fb"><div class="fbhead"><span class="fbt">${i+1}. ${esc(q.title)}<small>${esc(q.text)}</small></span></div>
        <details class="miss"><summary>Answers (${ans.length})</summary>${ans.length ? ans.map(r=>`<p class="cmt"><b>Bus ${r.bus}</b>: ${esc(r[q.id])}</p>`).join("") : `<p class="muted">No answers yet.</p>`}</details></article>`;
    }
  });
  box.innerHTML = html;
}

async function hydrateQuestAdmin(){
  if(state.tab!=="teachers" || !state.unlocked || state.tmode!=="quest") return;
  try{ state.qrows = await db.allStamps(state.tquest); }catch(e){ const b = $("#qlist"); if(b) b.innerHTML = `<li class="err">Could not load. Check the connection.</li>`; return; }
  paintQuest();
}
function paintQuest(){
  const box = $("#qlist"); if(!box) return;
  const qid = state.tquest;
  const stamped = new Set(state.qrows.filter(r=>r.quest===qid).map(r=>r.pair));
  qStore.get().forEach(it => {                      // show stamps still waiting to sync
    if(it.payload.quest!==qid) return;
    if(it.action==="awardStamp") stamped.add(it.payload.pair);
    if(it.action==="revokeStamp") stamped.delete(it.payload.pair);
  });
  const pairs = Object.values(PAIRS).filter(p=>!state.tbusF || p.bus===state.tbusF);
  $("#qsum").innerHTML = `<b>${pairs.filter(p=>stamped.has(p.id)).length}</b> of ${pairs.length} pairs stamped`;
  box.innerHTML = pairs.map(p=>{
    const on = stamped.has(p.id);
    return `<li><button data-act="stamp" data-pair="${p.id}" data-on="${on?1:0}"><span>Pair ${pairNum(p.id)}, Bus ${p.bus}<br><small class="muted">${esc(listNames(p.members.map(tag)))}</small></span>
      <span class="${on?"ok":"no"}">${on?"Stamped. Tap to undo":"Award stamp"}</span></button></li>`;
  }).join("");
}

async function hydrateAnswers(){
  if(state.tab!=="teachers" || !state.unlocked || state.tmode!=="answers") return;
  const box = $("#alist"); if(!box) return;
  let rows;
  try{ rows = await db.allAnswers(state.tq); }
  catch(e){ box.innerHTML = `<p class="err">Could not load answers. Check the connection.</p>`; return; }
  const roster = ROSTER.filter(r=>!state.tbusF || r.bus===state.tbusF);
  const map = new Map(rows.map(r=>[r.student_id,r]));
  const done = roster.filter(r=>map.has(r.id)), missing = roster.filter(r=>!map.has(r.id));
  $("#asum").innerHTML = `<b>${done.length}</b> of ${roster.length} answered`;
  box.innerHTML = done.map(r=>{
    const a = map.get(r.id);
    return `<article class="ans"><h3>${esc(tag(r))}<small>Bus ${r.bus}, ${fmtTime(a.updated_at)}</small></h3><p>${esc(a.answer)}</p></article>`;
  }).join("") + (missing.length
    ? `<details class="miss"><summary>Not answered yet (${missing.length})</summary><p>${missing.map(r=>esc(tag(r))).join(", ")}</p></details>` : "");
}
async function loadMine(){
  if(!state.me) return;
  try{
    const rows = await db.myAnswers(state.me.id);
    state.mine = {};
    rows.forEach(r => { state.mine[r.place] = r.answer; });

}

async function loadNames(){
  if(!remote) return;
  try{
    const rows = await api("getRoster");
    const next = {}; rows.forEach(r => { if(r.id && r.name) next[r.id] = String(r.name); });
    if(Object.keys(next).length){
      NAMES = next; store.set("tour_names", next);
      if(state.tab==="teachers" && state.unlocked) render();
    }
  }catch(e){}   // no signal: keep using the names already saved on this teacher's phone
}

async function loadStamps(){
  if(!state.me) return;
  try{
    const rows = await db.myStamps(state.me.pair);
    const next = {}; rows.forEach(r => { next[r.quest] = true; });
    const sig = o => Object.keys(o).sort().join(",");
    if(sig(next) !== sig(state.stamps)){
      state.stamps = next;
      if(state.tab==="itinerary" || state.tab==="quest") render();
    }
  }catch(e){}
}

const mineKey = (kind,id) => "tour_" + kind + "_" + id;
const typing = () => !!(document.activeElement && document.activeElement.tagName==="TEXTAREA");
// A student's own ratings and evaluation are remembered on their phone (students cannot read them back from the Sheet).
function loadFeedback(){
  state.ratings = {}; state.ev = {}; state.evSavedAt = ""; state.rdraft = {}; state.rating = null;
  if(!state.me) return;
  state.ratings = store.get(mineKey("ratings",state.me.id), {});
  const e = store.get(mineKey("eval",state.me.id), null);

}

function saveCSVFile(name, lines){
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type:"text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
// Feedback files never contain student names, numbers or IDs.
async function downloadFeedbackCSV(){
  const lines = [];
  if(state.fbmode==="stops"){
    const rows = await db.allRatings();
    lines.push(["bus","day","stop","rating","comment","saved_at"].map(csvCell).join(","));
    rows.forEach(r=>lines.push([r.bus,r.day,r.stop_title,r.rating,r.comment,r.updated_at].map(csvCell).join(",")));
    return saveCSVFile("tour-stop-ratings", lines);
  }
  const rows = await db.allEvals();
  const head = ["bus"];
  EVAL.forEach(q=>{ if(q.type==="rate") head.push(q.title+" (rating)", q.title+" (comment)"); else head.push(q.title); });
  head.push("saved_at");
  lines.push(head.map(csvCell).join(","));
  rows.forEach(r=>{
    const row = [r.bus];
    EVAL.forEach(q=>{ if(q.type==="rate") row.push(r[q.id+"_r"]||"", r[q.id+"_c"]||""); else row.push(r[q.id]||""); });
    row.push(r.updated_at);
    lines.push(row.map(csvCell).join(","));
  });
  saveCSVFile("tour-final-evaluations", lines);
}

function refreshTeacher(){
  if(state.tab!=="teachers" || !state.unlocked) return;
  ({ checkin:hydrateCp, overview:hydrateOverview, answers:hydrateAnswers, quest:hydrateQuestAdmin, feedback:hydrateFeedback })[state.tmode]();
}

function csvCell(v){
  let s = String(v==null?"":v);
  if(/^[=+\-@\t\r]/.test(s)) s = "'" + s;   // stops spreadsheets from running answers as formulas
  return '"' + s.replace(/"/g,'""') + '"';
}

async function downloadCSV(place){
  const rows = await db.allAnswers(place);
  const byId = new Map(ROSTER.map(r=>[r.id,r]));
  const head = ["student_id","student_name","bus","number","pair","day","place","question","answer","saved_at"];
  const lines = [head.map(csvCell).join(",")];
  rows.forEach(r => {
    const g = GUIDE[r.place] || { name:r.place, question:"" }, st = byId.get(r.student_id) || {};
    lines.push([r.student_id, NAMES[r.student_id]||"", r.bus, st.n||"", st.pair||"", r.day, g.name, g.question, r.answer, r.updated_at].map(csvCell).join(","));
  });
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type:"text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "tour-answers" + (place?"-"+place:"") + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* ============ RENDER + EVENTS ============ */
function render(){
  clearInterval(poll);
  const b = BUSES[state.bus-1];
  document.documentElement.style.setProperty("--bus", b.color);
  document.documentElement.style.setProperty("--bus-ink", b.ink);
  const views = { itinerary:viewItinerary, quest:viewQuest, eval:viewEval, info:viewInfo, teachers:viewTeachers };
  $("#app").innerHTML = views[state.tab]();
  document.querySelectorAll(".nav button").forEach(n=>n.setAttribute("aria-current", n.dataset.tab===state.tab?"page":"false"));
  if(state.tab==="quest") loadStamps();
  if(state.tab==="teachers" && state.unlocked){
    refreshTeacher();
    if(state.tmode==="checkin" || state.tmode==="overview") poll = setInterval(refreshTeacher, 20000);
  }
}

document.addEventListener("click", async e=>{
  const el = e.target.closest("[data-act],[data-tab]"); if(!el) return;
  if(el.dataset.tab){ state.tab = el.dataset.tab; render(); window.scrollTo(0,0); return; }
  const a = el.dataset.act;
  if(a==="bus"){ state.bus=+el.dataset.bus; store.set("tour_bus",state.bus); render(); }
  else if(a==="tbus"){ state.tbus=+el.dataset.bus; state.cp=null; render(); }
  else if(a==="day"){ state.day=+el.dataset.day; state.cp=null; render(); }
  else if(a==="pickme"){
    const id = $("#who").value, me = ROSTER.find(r=>r.id===id);
    if(!me){ $("#whoerr").textContent = "Choose your number from the list."; return; }
    state.me = me; state.bus = me.bus; state.mine = {}; state.stamps = {};
    store.set("tour_me",me); store.set("tour_bus",me.bus); loadFeedback(); render(); loadMine();
  }
  else if(a==="switchme"){ state.me=null; state.mine={}; state.stamps={}; store.set("tour_me",null); loadFeedback(); render(); }
  else if(a==="unlock"){
    const v = $("#pin").value, nm = ($("#tname").value||"").trim();
    try{
      if(remote){ state.pin = v; await api("verifyPin"); }
      else if(v !== CONFIG.teacherPin) throw new Error("bad pin");
      state.tname = nm; store.set("tour_tname",nm);
      state.unlocked = true; render();
      flushQueue().then(()=>updateSync());
      loadNames();
    }catch(err){
      state.pin = "";
      $("#pinerr").textContent = (err.fatal || err.message==="bad pin")
        ? "That PIN is not correct." : "Could not reach the server. Check the connection and try again.";
    }
  }
  else if(a==="openrate"){
    const k = el.dataset.k;
    state.rating = (state.rating===k) ? null : k;
    delete state.rdraft[k];
    render();
  }
  else if(a==="star"){
    const name = el.dataset.name, kind = name.slice(0,1), id = name.slice(2), v = +el.dataset.v;
    if(kind==="r") rdraft(id).rating = v;
    else { state.ev[id+"_r"] = v; persistEv(); }
    document.querySelectorAll(`[data-stars="${name}"] .star`).forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.v===v)));
  }
  else if(a==="saverate"){
    if(!state.me) return;
    const key = el.dataset.k, d = rdraft(key), st = $("#rate-status");
    if(!d.rating){ st.textContent = "Tap a number from 1 to 5 first."; return; }
    st.textContent = "Saving...";
    const comment = d.comment.trim();
    try{
      await db.setRating({ student_id:state.me.id, bus:state.me.bus, day:+el.dataset.day, stop_key:key, stop_title:el.dataset.t, rating:d.rating, comment });
      state.ratings[key] = { rating:d.rating, comment };
      store.set(mineKey("ratings",state.me.id), state.ratings);
      st.textContent = "Saved at " + fmtTime(new Date().toISOString()) + ". Thank you!";
      const btn = document.querySelector(`.learn[data-k="${key}"]`);
      if(btn) btn.textContent = `Rated ${d.rating} of 5. Edit`;
    }catch(err){
      st.textContent = "Could not save. Check your connection and try again.";
    }
  }
  else if(a==="evsave"){
    if(!state.me) return;
    const st = $("#ev-status"), e = state.ev, p = { student_id:state.me.id, bus:state.me.bus };
    EVAL.forEach(q=>{
      if(q.type==="rate"){ p[q.id+"_r"] = +e[q.id+"_r"] || 0; p[q.id+"_c"] = String(e[q.id+"_c"]||"").trim(); }
      else p[q.id] = String(e[q.id]||"").trim();
    });
    const blank = EVAL.filter(q => q.type==="rate" ? !p[q.id+"_r"] : !p[q.id]).length;
    if(blank===EVAL.length && !EVAL.some(q=>q.type==="rate" && p[q.id+"_c"])){ st.textContent = "Answer at least one question first."; return; }
    st.textContent = "Saving...";
    try{
      await db.setEval(p);
      state.evSavedAt = new Date().toISOString(); persistEv();
      st.textContent = "Saved at " + fmtTime(state.evSavedAt) + ". " + (blank ? blank+" question"+(blank>1?"s":"")+" still blank. You can come back to finish." : "All questions answered. Thank you!");
    }catch(err){
      st.textContent = "Could not save. Your answers are kept on this phone. Try again when you have signal.";
    }
  }
  else if(a==="fbmode"){ state.fbmode = el.dataset.mode; state.fbOpen = null; render(); }
  else if(a==="fbopen"){ state.fbOpen = (state.fbOpen===el.dataset.k) ? null : el.dataset.k; paintFeedback(); }
  else if(a==="fbrefresh"){ hydrateFeedback(); }
  else if(a==="fbcsv"){
    try{ await downloadFeedbackCSV(); }
    catch(err){ alert("Could not create the file. Check the connection and try again."); }
  }
  else if(a==="lock"){
    state.unlocked = false; state.pin = ""; state.cp = null; NAMES = {}; store.set("tour_names", {}); render();
  }
  else if(a==="openplace"){ state.open = (state.open===el.dataset.p) ? null : el.dataset.p; render(); }
  else if(a==="saveans"){
    const key = el.dataset.p, ta = $("#ans-"+key), st = $("#ans-status");
    const text = ta.value.trim();
    if(!state.me) return;
    if(!text){ st.textContent = "Write an answer first."; return; }
    st.textContent = "Saving...";
    const day = (PLACE_LIST.find(x=>x.key===key)||{}).day || state.day;
    try{
      await db.setAnswer({ student_id:state.me.id, bus:state.me.bus, day, place:key, answer:text });
      state.mine[key] = text;
      try{ localStorage.removeItem("tour_draft_"+key); }catch(e){}
      st.textContent = "Saved at " + fmtTime(new Date().toISOString()) + ".";
      const btn = document.querySelector(`.learn[data-p="${key}"]`);
      if(btn) btn.textContent = "Answered. View or edit";
    }catch(err){
      st.textContent = "Could not save. Your answer is kept on this phone. Try again when you have signal.";
    }
  }
  else if(a==="tmode"){ state.tmode = el.dataset.mode; state.cp = null; render(); }
  else if(a==="csv"){
    try{ await downloadCSV(el.dataset.scope==="one" ? state.tq : null); }
    catch(err){ alert("Could not create the file. Check the connection and try again."); }
  }
  else if(a==="cpopen"){
    const key = el.dataset.k;
    if(state.cp && state.cp.key===key) state.cp = null;
    else { const rec = cpRecord(key); state.cp = { key, missing:new Set(rec ? rec.missing_ids : []) }; }
    paintCp();
  }
  else if(a==="cpname"){
    const m = state.cp.missing, id = el.dataset.id;
    if(m.has(id)) m.delete(id); else m.add(id);
    paintCp();
  }
  else if(a==="cpsave"){
    const key = el.dataset.k;
    const stop = cpStops(state.day, state.tbus).find(x=>rowKey(state.day,x.title,state.tbus)===key);
    const roster = rosterOf(state.tbus), miss = state.cp.missing;
    if(!stop) return;
    el.disabled = true; el.textContent = "Saving...";
    const payload = { key, day:state.day, bus:state.tbus, time:stop.t, title:stop.title, total:roster.length,
      missing:[...miss], missing_names:roster.filter(r=>miss.has(r.id)).map(tag).join(", "),
      at:new Date().toISOString(), by:state.tname };
    const job = teacherWrite("saveCheckpoint", payload, "cp:"+key);
    state.cp = null; paintCp(); updateSync();          // show it straight away; it syncs in the background
    await job; updateSync();
    if(remote) hydrateCp();
  }
  else if(a==="stamp"){
    const on = el.dataset.on==="1", pair = el.dataset.pair;
    const job = teacherWrite(on?"revokeStamp":"awardStamp", { pair, quest:state.tquest, by:state.tname }, "stamp:"+pair+"|"+state.tquest);
    paintQuest(); updateSync();
    await job; updateSync();
    if(remote) hydrateQuestAdmin(); else { state.qrows = await db.allStamps(state.tquest); paintQuest(); }
  }
});

document.addEventListener("change", e=>{
  const el = e.target.closest("[data-change]"); if(!el) return;
  if(el.dataset.change==="tq"){ state.tq = el.value; render(); }
  else if(el.dataset.change==="tquest"){ state.tquest = el.value; render(); }
  else if(el.dataset.change==="tbusf"){ state.tbusF = +el.value; render(); }
});
document.addEventListener("input", e=>{
  const el = e.target;
  if(el.matches && el.matches("textarea[data-draft]")){
    try{ localStorage.setItem("tour_draft_"+el.dataset.draft, el.value); }catch(err){}
  }
  else if(el.matches && el.matches("textarea[data-rc]")){ rdraft(el.dataset.rc).comment = el.value; }
  else if(el.matches && el.matches("textarea[data-ev]")){ state.ev[el.dataset.ev] = el.value; persistEv(); }
});

(function(){
  const a = fmtDate(DAYS[0].date,{month:"short",day:"numeric"});
  const z = fmtDate(DAYS[DAYS.length-1].date,{month:"short",day:"numeric",year:"numeric"});
  $("#range").textContent = a + " to " + z;
  if(state.me){ const fresh = ROSTER.find(r=>r.id===state.me.id); state.me = fresh || null; if(fresh) store.set("tour_me",fresh); }
  loadFeedback(); render(); loadMine(); loadStamps();
  const tick = () => flushQueue().then(n=>{ updateSync(); if(n) refreshTeacher(); });
  setInterval(tick, 15000);
  if(window.addEventListener) window.addEventListener("online", tick);
})();
</script>
